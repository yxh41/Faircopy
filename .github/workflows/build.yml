name: Build Package

on:
  workflow_dispatch:
  push:
    branches:
      - release

env:
  VERSION: 1.0
  FINALPACKAGE: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1

jobs:
  build:
    runs-on: macos-15

    steps:
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.4'

    - name: Setup Environment
      run: |
        echo "$HOME/theos/bin" >> $GITHUB_PATH
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        echo "THEOS_IGNORE_PARALLEL_BUILDING_NOTICE=yes" >> $HOME/.theosrc

    - name: Setup Theos
      run: |
        curl -fsSL https://raw.githubusercontent.com/OwnGoalStudio/theos/refs/heads/master/bin/install-theos -o "$RUNNER_TEMP/install-theos"
        # The installer explicitly updates Homebrew despite HOMEBREW_NO_AUTO_UPDATE.
        sed -i '' '/^[[:space:]]*brew update || true$/d' "$RUNNER_TEMP/install-theos"
        if bash "$RUNNER_TEMP/install-theos"; then
          exit 0
        fi
        # install-theos exits 8 when it cannot fetch the patched SDK from the
        # release download CDN. The release API serves the same asset, so seed
        # the SDK from there instead of failing the whole build.
        echo "install-theos failed; seeding the iOS SDK from the release API"
        test -d "$HOME/theos/bin"
        python3 - "$HOME/theos/sdks" <<'PY'
        import json
        import os
        import re
        import shutil
        import sys
        import tarfile
        import urllib.request

        dest = sys.argv[1]
        token = os.environ.get("GITHUB_TOKEN", "")
        base_headers = {"Accept": "application/vnd.github+json", "User-Agent": "faircopy-ci"}
        if token:
            base_headers["Authorization"] = "Bearer " + token


        def fetch(url, accept):
            headers = dict(base_headers)
            headers["Accept"] = accept
            request = urllib.request.Request(url, headers=headers)
            return urllib.request.urlopen(request, timeout=300)


        with fetch("https://api.github.com/repos/theos/sdks/releases/latest", base_headers["Accept"]) as response:
            release = json.load(response)


        def version(asset):
            match = re.match(r"iPhoneOS(\d+(?:\.\d+)*)\.sdk\.tar\.xz$", asset["name"])
            return tuple(int(part) for part in match.group(1).split(".")) if match else ()


        candidates = sorted((asset for asset in release["assets"] if version(asset)), key=version)
        asset = candidates[-1]
        sdk = asset["name"][: -len(".tar.xz")]
        os.makedirs(dest, exist_ok=True)
        shutil.rmtree(os.path.join(dest, sdk), ignore_errors=True)
        archive = os.path.join(dest, asset["name"])
        url = "https://api.github.com/repos/theos/sdks/releases/assets/%d" % asset["id"]
        with fetch(url, "application/octet-stream") as response, open(archive, "wb") as handle:
            shutil.copyfileobj(response, handle)
        print("downloaded %s (%d bytes)" % (asset["name"], os.path.getsize(archive)))
        with tarfile.open(archive) as tar:
            tar.extractall(dest)
        os.remove(archive)
        print("sdks now:", sorted(os.listdir(dest)))
        PY
        ls -1 "$HOME/theos/sdks"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Environment (RootHide)
      run: |
        echo "$HOME/theos-roothide-legacy/bin" >> $GITHUB_PATH
        echo "THEOS=$HOME/theos-roothide-legacy" >> $GITHUB_ENV

    - name: Setup Theos (RootHide)
      run: |
        git clone --branch legacy-roothide --depth 1 --recurse-submodules https://github.com/owngoal-dev/theos-roothide.git "$THEOS"
        cp -R "$HOME/theos/sdks/." "$THEOS/sdks/"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Fetch swift-create-xcframework
      uses: robinraju/release-downloader@v1.11
      with:
        repository: Lessica/swift-create-xcframework
        tag: v5.9
        fileName: swift-create-xcframework@5.9.zip

    - name: Install swift-create-xcframework
      run: |
        SWIFT_CREATE_XCFRAMEWORK_PATH=$(pwd)/swift-create-xcframework@5.9.zip
        pushd $HOME/theos/bin
        unzip $SWIFT_CREATE_XCFRAMEWORK_PATH
        popd
        pushd $HOME/theos-roothide-legacy/bin
        unzip $SWIFT_CREATE_XCFRAMEWORK_PATH
        popd

    - name: Install ldid-procursus
      run: |
        brew uninstall ldid || true
        brew install ldid-procursus

    - name: Checkout
      uses: actions/checkout@v4

    - name: Build (arm)
      run: |
        source devkit/env.sh
        make clean package

    - name: Build (arm64)
      run: |
        source devkit/rootless.sh
        make clean package

    - name: Build (arm64e)
      run: |
        source devkit/roothide.sh
        make clean package

    - name: Collect dSYMs
      run: |
        find .theos/obj -name "*.dSYM" -exec cp -r {} ./packages/ \;
        VERSION=$(grep '^Version:' .theos/_/DEBIAN/control | awk '{print $2}')
        echo "VERSION=$VERSION" >> $GITHUB_ENV

    - name: Upload dSYMs
      uses: actions/upload-artifact@v4
      with:
        name: symbols-${{ env.VERSION }}
        retention-days: 7
        path: |
          ./packages/*.dSYM

    - name: Upload Packages
      uses: actions/upload-artifact@v4
      with:
        name: packages-${{ env.VERSION }}
        retention-days: 7
        path: |
          ./packages/*.deb
