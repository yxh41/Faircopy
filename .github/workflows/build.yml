name: Build Package

on:
  workflow_dispatch:
  push:
    branches:
      - release

env:
  VERSION: 1.0
  FINALPACKAGE: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.4'

    - name: Setup Environment
      run: |
        echo "$HOME/theos/bin" >> $GITHUB_PATH
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        echo "THEOS_IGNORE_PARALLEL_BUILDING_NOTICE=yes" >> $HOME/.theosrc

    - name: Setup Theos
      run: |
        curl -fsSL https://raw.githubusercontent.com/OwnGoalStudio/theos/refs/heads/master/bin/install-theos -o "$RUNNER_TEMP/install-theos"
        # The installer explicitly updates Homebrew despite HOMEBREW_NO_AUTO_UPDATE.
        sed -i '' '/^[[:space:]]*brew update || true$/d' "$RUNNER_TEMP/install-theos"
        bash "$RUNNER_TEMP/install-theos"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Environment (RootHide)
      run: |
        echo "$HOME/theos-roothide-legacy/bin" >> $GITHUB_PATH
        echo "THEOS=$HOME/theos-roothide-legacy" >> $GITHUB_ENV

    - name: Setup Theos (RootHide)
      run: |
        git clone --branch legacy-roothide --depth 1 --recurse-submodules https://github.com/owngoal-dev/theos-roothide.git "$THEOS"
        cp -R "$HOME/theos/sdks/." "$THEOS/sdks/"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Fetch swift-create-xcframework
      uses: robinraju/release-downloader@v1.11
      with:
        repository: Lessica/swift-create-xcframework
        tag: v5.9
        fileName: swift-create-xcframework@5.9.zip

    - name: Install swift-create-xcframework
      run: |
        SWIFT_CREATE_XCFRAMEWORK_PATH=$(pwd)/swift-create-xcframework@5.9.zip
        pushd $HOME/theos/bin
        unzip $SWIFT_CREATE_XCFRAMEWORK_PATH
        popd
        pushd $HOME/theos-roothide-legacy/bin
        unzip $SWIFT_CREATE_XCFRAMEWORK_PATH
        popd

    - name: Install ldid-procursus
      run: |
        brew uninstall ldid || true
        brew install ldid-procursus

    - name: Checkout
      uses: actions/checkout@v4

    - name: Build (arm)
      run: |
        source devkit/env.sh
        make clean package

    - name: Build (arm64)
      run: |
        source devkit/rootless.sh
        make clean package

    - name: Build (arm64e)
      run: |
        source devkit/roothide.sh
        make clean package

    - name: Collect dSYMs
      run: |
        find .theos/obj -name "*.dSYM" -exec cp -r {} ./packages/ \;
        VERSION=$(grep '^Version:' .theos/_/DEBIAN/control | awk '{print $2}')
        echo "VERSION=$VERSION" >> $GITHUB_ENV

    - name: Upload dSYMs
      uses: actions/upload-artifact@v4
      with:
        name: symbols-${{ env.VERSION }}
        retention-days: 7
        path: |
          ./packages/*.dSYM

    - name: Upload Packages
      uses: actions/upload-artifact@v4
      with:
        name: packages-${{ env.VERSION }}
        retention-days: 7
        path: |
          ./packages/*.deb
